name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '0 2 * * 0'

jobs:
  detect_changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      gui_only: ${{ steps.set_gui_only.outputs.gui_only }}
    steps:
    - uses: actions/checkout@v5
    - uses: dorny/paths-filter@v4
      id: filter
      with:
        filters: |
          gui_only:
            - '.gui/**'
          other_changes:
            - '!.gui/**'
    - name: Determine GUI-only
      id: set_gui_only
      run: |
        if [ "${{ steps.filter.outputs.gui_only }}" == "true" ] && \
           [ "${{ steps.filter.outputs.other_changes }}" == "false" ]; then
          echo "gui_only=true" >> "$GITHUB_OUTPUT"
        else
          echo "gui_only=false" >> "$GITHUB_OUTPUT"
        fi

  smoke-tests:
    needs: [detect_changes]
    strategy:
      fail-fast: true

    runs-on: "ubuntu-latest"
    environment: Production
    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage

    permissions:
      contents: write

    steps:
    - name: Ensure venv path exists
      run: mkdir -p ~/.omniax_venvs/Python_${{ runner.python_version }}/${{ runner.arch }}

    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install dependencies
      run: |
        .tools/ci_dependency

    - name: Creating virtualenv
      run: |
        python3 -mvenv $HOME/.omniax_$(uname -m)_Python_$(python3 --version | sed -e 's#Python ##')
        source $HOME/.omniax_$(uname -m)_Python_$(python3 --version | sed -e 's#Python ##')/bin/activate

        if command -v brew; then
          pip install psycopg2-binary
        fi

    - name: Smoke Tests
      if: needs.detect_changes.outputs.gui_only != 'true'
      run: |
        python3 .tests/smoke_tests --run_with_coverage

    - name: GUI-only Tests
      if: needs.detect_changes.outputs.gui_only == 'true'
      run: |
        python3 .tests/gui_only --run_with_coverage

    - name: Run linter
      if: needs.detect_changes.outputs.gui_only != 'true'
      run: |
        python3 .tests/linter --check_only_changed_since_last_success

    - name: Coverage report
      if: always()
      continue-on-error: true
      run: |
        python3 .tests/coverage_report --label "smoke-tests"

    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-smoke-tests
        path: coverage-report/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14

  install-via-pip:
    needs: [smoke-tests, docker-test, detect_changes]
    if: needs.detect_changes.outputs.gui_only != 'true'
    runs-on: ubuntu-24.04
    environment: Production
    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        .tools/ci_dependency

    - name: main test script
      run: |
        python3 .tests/install_via_pip --debug --run_with_coverage

    - name: Prepare coverage tooling
      if: always()
      run: |
        python3 -m venv "$RUNNER_TEMP/coverage-venv"
        "$RUNNER_TEMP/coverage-venv/bin/pip" install --upgrade pip coverage
        echo "$RUNNER_TEMP/coverage-venv/bin" >> "$GITHUB_PATH"

    - name: Coverage report
      if: always()
      continue-on-error: true
      run: |
        python3 .tests/coverage_report --label "install-via-pip-${{ matrix.os }}"

    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-install-via-pip-${{ matrix.os }}
        path: coverage-report/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14
  docker-test:
    needs: [smoke-tests, detect_changes]
    if: needs.detect_changes.outputs.gui_only != 'true'
    runs-on: ubuntu-24.04
    environment: Production
    env:
      COVERAGE_FILE: /var/opt/omniopt/docker_user_dir/.coverage
    strategy:
      fail-fast: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install dependencies
      run: |
        .tools/ci_dependency
    - name: main test script
      run: |
        ./omniopt_docker python3 .tests/main --num_random_steps=1 --max_eval=2 --exit_on_first_error --run_with_coverage --only=suite:basic

    - name: Prepare coverage tooling
      if: always()
      run: |
        python3 -m venv "$RUNNER_TEMP/coverage-venv"
        "$RUNNER_TEMP/coverage-venv/bin/pip" install --upgrade pip coverage
        echo "$RUNNER_TEMP/coverage-venv/bin" >> "$GITHUB_PATH"

    - name: Coverage report
      if: always()
      continue-on-error: true
      run: |
        python3 .tests/coverage_report --label "docker-test"

    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-docker-test
        path: coverage-report/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14

  main-test:
    needs: [smoke-tests, install-via-pip, detect_changes]
    if: needs.detect_changes.outputs.gui_only != 'true'
    runs-on: ${{ matrix.os }}
    environment: Production
    env:
      COVERAGE_FILE: ${{ github.workspace }}/.coverage
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Install dependencies
      run: |
        .tools/ci_dependency

    - name: Creating virtualenv
      if: runner.os == 'Linux'
      run: |
        VENV_PATH="$HOME/.omniax_$(uname -m)_Python_$(python3 --version | sed -e 's#Python ##')"
        python3 -m venv "$VENV_PATH"
        source "$VENV_PATH/bin/activate"

        if command -v brew >/dev/null 2>&1; then
          pip install psycopg2-binary
        fi

    - name: Installing stuff
      if: runner.os == 'Linux'
      run: |
        VENV_PATH="$HOME/.omniax_$(uname -m)_Python_$(python3 --version | sed -e 's#Python ##')"
        source "$VENV_PATH/bin/activate"
        pip install --no-cache-dir --upgrade pip
        pip install --no-cache-dir setuptools
        pip install --no-cache-dir pip wheel
        pip install --no-cache-dir multidict

    - name: plot tests
      run: |
        python3 .tests/plots --run_with_coverage

    - name: main test script
      shell: bash
      run: |
        python3 .tests/main --num_random_steps=1 --max_eval=2 --exit_on_first_error --no_plots --run_with_coverage

    - name: Coverage report
      if: always()
      continue-on-error: true
      run: |
        python3 .tests/coverage_report --label "main-test-${{ matrix.os }}"

    - name: Upload coverage artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-main-test-${{ matrix.os }}
        path: coverage-report/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14

    - uses: release-drafter/release-drafter@v5
      with:
          config-name: release-drafter.yml
      #   disable-autolabeler: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create a new version
      if: ${{ success() && github.event_name == 'push' }}
      run: |
        echo "Creating new version"
        git tag ${{ github.run_number }} || true
        git push origin --tags || true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge-coverage:
    needs: [smoke-tests, install-via-pip, docker-test, main-test, detect_changes]
    if: always() && needs.detect_changes.outputs.gui_only != 'true'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download coverage artifacts
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        pattern: coverage-*
        path: coverage-artifacts

    - name: Prepare coverage tooling
      run: |
        python3 -m venv "$RUNNER_TEMP/coverage-venv"
        "$RUNNER_TEMP/coverage-venv/bin/pip" install --upgrade pip coverage
        echo "$RUNNER_TEMP/coverage-venv/bin" >> "$GITHUB_PATH"

    - name: Merge coverage
      continue-on-error: true
      run: |
        python3 .tests/coverage_report \
          --data-dir coverage-artifacts \
          --label "merged (all test jobs)" \
          --output-dir coverage-report

    - name: Upload merged coverage artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-merged
        path: coverage-report/
        if-no-files-found: warn
        include-hidden-files: true
        retention-days: 14

  todo-to-issue:
    needs: [smoke-tests]
    strategy:
      fail-fast: true
    runs-on: "ubuntu-latest"
    environment: Production
    steps:
      - uses: "actions/checkout@v5"
      - name: "TODO to Issue"
        uses: "alstr/todo-to-issue-action@v5"

  deploy-to-pypi:
    needs: [docker-test, main-test, install-via-pip, detect_changes]
    permissions:
      contents: read
    environment: Production
    runs-on: ubuntu-latest

    if: needs.detect_changes.outputs.gui_only != 'true' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        sudo apt-get purge -y man-db manpages
        sudo apt-get install -y xterm whiptail python3-dev php-cli unzip curl python3-toolz php-mbstring git nodejs
        pip install build
        pip install setuptools
    - name: Creating pyproject.toml
      run: |
        bash .tools/create_pyproject_toml ${{ github.run_number }}
    - name: Build package
      run: |
        python -m build
        cp -r dist ..
    - name: Publish package
      uses: pypa/gh-action-pypi-publish@27b31702a0e7fc50959f5ad993c78deac1bdfc29
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        packages-dir: dist/
