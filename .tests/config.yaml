groups:
  meta:
    - name: "Smoke tests"
      command: "python3 .tests/smoke_tests.py"
      wanted_exit_code: 0
      skip_if: is_in_container
    - name: "pyright"
      command: "pyright ."
      wanted_exit_code: 0
      skip_if: is_ci

  basic:
    - name: "Basic tests"
      command: "{OMNIOPT_CALL} --tests --mem_gb 1 --time 10 --experiment_name test_name --gpus {NUM_GPUS}"
      wanted_exit_code: 0

  simple_optimization:
    - name: "Simple optimization run"
      command: ".tests/start_simple_optimization_run.py --num_parallel_jobs={num_parallel_jobs} --gpus={NUM_GPUS} --num_random_steps={num_random_steps} --max_eval={max_eval} --mem_gb={mem_gb} --generate_all_jobs_at_once --follow"
      wanted_exit_code: 0
    - name: "Continued test run"
      command: "./omniopt --continue runs/{TESTNAME}/0 --num_parallel_jobs {num_parallel_jobs} --worker_timeout 10 --follow --gpus {NUM_GPUS} --mem_gb {mem_gb} --num_random_steps={num_random_steps} --max_eval={max_eval} --send_anonymized_usage_stats --generate_all_jobs_at_once"
      wanted_exit_code: 0
    - name: "Continuing already continued job"
      command: "./omniopt --continue runs/{TESTNAME}/1 --num_parallel_jobs {num_parallel_jobs} --worker_timeout 10 --follow --gpus {NUM_GPUS} --mem_gb {mem_gb} --num_random_steps={num_random_steps} --max_eval={max_eval} --parameter float_param range -1000 1000 float --send_anonymized_usage_stats --generate_all_jobs_at_once"
      wanted_exit_code: 0

  defective_configs:
    - name: "Testing defective toml file"
      command: "{OMNIOPT_CALL} --config_toml .tests/defective_example_config.toml --follow"
      wanted_exit_code: 5
      alternative_exit_code: 1
    - name: "Testing defective yaml file"
      command: "{OMNIOPT_CALL} --config_yaml .tests/defective_example_config.yaml --follow"
      wanted_exit_code: 5
      alternative_exit_code: 104
    - name: "Testing defective json file"
      command: "{OMNIOPT_CALL} --config_json .tests/defective_example_config.json --follow"
      wanted_exit_code: 5
      alternative_exit_code: 104
    - name: "test_bash_argparse_clone"
      command: ".tests/test_bash_argparse_clone.py"
      wanted_exit_code: 0
    - name: "Testing non-existent json config file"
      command: "{OMNIOPT_CALL} --config_json /dev/idontexist.json"
      wanted_exit_code: 100

  slurm:
    - name: "force_local_execution"
      command: ".tests/start_simple_optimization_run.py --force_local_execution --num_parallel_jobs=1 --num_random_steps=2 --max_eval=3 --generate_all_jobs_at_once --follow"
      wanted_exit_code: 0
      only_if: "command_exists_sbatch"

  linter:
    - name: "Linter"
      command: "bash .tests/linter"
      wanted_exit_code: 0
      skip_if: is_ci
    - name: "lint_python"
      command: ".tests/lint_python.py"
      wanted_exit_code: 0
      skip_if: is_ci

  orchestrator:
    - name: "Test orchestrator"
      command: "./.tests/orchestrator.py"
      wanted_exit_code: 0
    - name: "Test seed 1234"
      command: ".tests/test_seed.py --seed 1234 --gpus {NUM_GPUS} --hash 86157f2f4b60e19a713c3f85ca13e19a"
      wanted_exit_code: 0
    - name: "Test seed 4321"
      command: ".tests/test_seed.py --seed 4321 --gpus {NUM_GPUS} --hash 60a91150ddb1f17f2c040230e9673dc0"
      wanted_exit_code: 0
    - name: "Testing multiple evals per arm"
      command: ".tests/test_multiple_evals_per_arm.py"
      wanted_exit_code: 0
    - name: "adding_jobs_to_new_job"
      command: ".tests/adding_jobs_to_new_job.py"
      wanted_exit_code: 0

  parameter_validation:
    - name: "Test OO without needed params (none at all)"
      command: "{OMNIOPT_CALL}"
      wanted_exit_code: 19
      alternative_exit_code: 104
    - name: "Test OO without needed params (only --parameter)"
      command: "{OMNIOPT_CALL} --parameter --mem_gb=4 --follow"
      wanted_exit_code: 2
      alternative_exit_code: 104
    - name: "Test OO without needed params (full --parameter)"
      command: "{OMNIOPT_CALL} --parameter x range 0 1 float --mem_gb=4 --follow"
      wanted_exit_code: 19
      alternative_exit_code: 104
    - name: "Test OO without needed params (missing experiment name)"
      command: "{OMNIOPT_CALL} --parameter x range 0 1 float --run_program 'echo' --mem_gb=4 --follow"
      wanted_exit_code: 19
      alternative_exit_code: 104
    - name: "Test OO without needed params (missing time)"
      command: "{OMNIOPT_CALL} --parameter x range 0 1 float --run_program 'echo' --experiment_name=asdf --mem_gb=4 --follow"
      wanted_exit_code: 19
      alternative_exit_code: 104
    - name: "Test OO without needed params (missing max eval)"
      command: "{OMNIOPT_CALL} --parameter x range 0 1 float --run_program 'echo' --experiment_name=asdf --time=12 --mem_gb=4 --gpus={NUM_GPUS} --follow"
      wanted_exit_code: 89
      alternative_exit_code: 104
    - name: "Incomplete fixed parameter"
      command: "{OMNIOPT_CALL} --run_program 'echo' --experiment_name=asdf --time=12 --max_eval 123 --parameter x fixed --mem_gb=4 --follow --gpus={NUM_GPUS}"
      wanted_exit_code: 181
      alternative_exit_code: 104
    - name: "Invalid name for parameter: exit_code"
      command: "{OMNIOPT_CALL} --run_program 'echo' --experiment_name=asdf --time=12 --max_eval 123 --parameter exit_code range 0 1 --mem_gb=4 --follow --gpus={NUM_GPUS}"
      wanted_exit_code: 181
      alternative_exit_code: 104
    - name: "Incomplete choice parameter"
      command: "{OMNIOPT_CALL} --run_program 'echo' --experiment_name=asdf --time=12 --max_eval 123 --parameter x choice --mem_gb=4 --follow --gpus={NUM_GPUS}"
      wanted_exit_code: 181
      alternative_exit_code: 104
    - name: "Incomplete range parameter (missing upper and lower)"
      command: "{OMNIOPT_CALL} --run_program 'echo' --experiment_name=asdf --time=12 --max_eval 123 --parameter x range --mem_gb=4 --follow --gpus={NUM_GPUS}"
      wanted_exit_code: 181
      alternative_exit_code: 104
    - name: "Incomplete range parameter (missing upper)"
      command: "{OMNIOPT_CALL} --run_program 'echo' --experiment_name=asdf --time=12 --max_eval 123 --parameter x range 0 --mem_gb=4 --follow --gpus={NUM_GPUS}"
      wanted_exit_code: 181
      alternative_exit_code: 104
    - name: "Non-unique parameter names"
      command: "{OMNIOPT_CALL} --run_program 'echo' --experiment_name=asdf --time=12 --max_eval 123 --parameter x choice 123 --parameter x choice 1234 --mem_gb=4 --follow --gpus={NUM_GPUS}"
      wanted_exit_code: 181
      alternative_exit_code: 104
    - name: "Invalid range type (wrong type)"
      command: "{OMNIOPT_CALL} --run_program 'echo' --experiment_name=asdf --time=12 --max_eval 123 --parameter x range 123 123123 123 --mem_gb=4 --gpus={NUM_GPUS} --follow"
      wanted_exit_code: 181
      alternative_exit_code: 104
    - name: "Invalid range type (upper = lower)"
      command: "{OMNIOPT_CALL} --run_program 'echo' --experiment_name=asdf --time=12 --max_eval 123 --parameter x range 0 0 --mem_gb=4 --gpus={NUM_GPUS} --follow"
      wanted_exit_code: 181
      alternative_exit_code: 104
    - name: "Invalid range type (missing upper limit and type)"
      command: "{OMNIOPT_CALL} --run_program 'echo' --experiment_name=asdf --time=12 --max_eval 123 --parameter x range 0 --mem_gb=4 --gpus={NUM_GPUS} --follow"
      wanted_exit_code: 181
      alternative_exit_code: 104
    - name: "Invalid range type (missing upper limit)"
      command: "{OMNIOPT_CALL} --run_program 'echo' --experiment_name=asdf --time=12 --max_eval 123 --parameter x range 0 float --mem_gb=4 --gpus={NUM_GPUS} --follow"
      wanted_exit_code: 181
      alternative_exit_code: 104

  external_generator:
    - name: "External generator"
      command: ".tests/external_generator.py"
      wanted_exit_code: 0

  simple_optimization_variants:
    - name: "SEM-Test"
      command: ".tests/start_simple_optimization_run.py --num_parallel_jobs=1 --gpus={NUM_GPUS} --num_random_steps=1 --max_eval=2 --mem_gb=4 --generate_all_jobs_at_once --random_sem --follow"
      wanted_exit_code: 0

  constraints:
    - name: "Invalid constraint"
      command: "./omniopt --partition=alpha --experiment_name=constraint_test --mem_gb={mem_gb} --time=60 --worker_timeout=60 --max_eval=500 --num_parallel_jobs=20 --gpus={NUM_GPUS} --num_random_steps=20 --follow --send_anonymized_usage_stats --run_program='ZWNobyAiUkVTVUxUOiAleCV5Ig==' --cpus_per_task=1 --model=BOTORCH_MODULAR --run_mode=local --parameter x range 0 100 int --parameter y range 0 1000 float --experiment_constraints $(echo 'x + y > 10' | base64 -w0) --ui_url  --send_anonymized_usage_stats"
      wanted_exit_code: 19
    - name: "Invalid constraint (starting with comparison operator)"
      command: "./omniopt --partition=alpha --experiment_name=constraint_test --mem_gb={mem_gb} --time=60 --worker_timeout=60 --max_eval=4 --num_parallel_jobs=2 --gpus={NUM_GPUS} --num_random_steps=2 --run_program=ZWNobyAiUkVTVUxUOiAleCV5Ig== --cpus_per_task=1 --model=BOTORCH_MODULAR --run_mode=local --parameter x range 0 100 int --parameter y range 0 1000 float --experiment_constraints $(echo '>= 10' | base64 -w0) --seed 1234 --verbose_tqdm --send_anonymized_usage_stats --follow"
      wanted_exit_code: 19
    - name: "Invalid constraint (ending with comparison operator)"
      command: "./omniopt --partition=alpha --experiment_name=constraint_test --mem_gb={mem_gb} --time=60 --worker_timeout=60 --max_eval=4 --num_parallel_jobs=2 --gpus={NUM_GPUS} --num_random_steps=2 --run_program=ZWNobyAiUkVTVUxUOiAleCV5Ig== --cpus_per_task=1 --model=BOTORCH_MODULAR --run_mode=local --parameter x range 0 100 int --parameter y range 0 1000 float --experiment_constraints $(echo '10 <=' | base64 -w0) --seed 1234 --verbose_tqdm --send_anonymized_usage_stats --follow"
      wanted_exit_code: 19
    - name: "Valid constraint and seed"
      command: "./omniopt --partition=alpha --experiment_name=constraint_test_to_be_continued --mem_gb={mem_gb} --time=60 --worker_timeout=60 --max_eval=4 --num_parallel_jobs=2 --gpus={NUM_GPUS} --num_random_steps=2 --run_program=ZWNobyAiUkVTVUxUOiAleCV5Ig== --cpus_per_task=1 --model=BOTORCH_MODULAR --run_mode=local --parameter x range 0 100 int --parameter y range 0 1000 float --experiment_constraints $(echo 'x + y >= 10' | base64 -w0) --ui_url  --seed 1234 --verbose_tqdm --send_anonymized_usage_stats --follow"
      wanted_exit_code: 0

  load_config:
    - name: "Load from toml"
      command: "{OMNIOPT_CALL} --config_toml .tests/example_config_{CONFIG_VARIANT}.toml --follow"
      wanted_exit_code: 0
    - name: "Load from yaml"
      command: "{OMNIOPT_CALL} --config_yaml .tests/example_config_{CONFIG_VARIANT}.yaml --follow"
      wanted_exit_code: 0
    - name: "Load from json"
      command: "{OMNIOPT_CALL} --config_json .tests/example_config_{CONFIG_VARIANT}.json --follow"
      wanted_exit_code: 0

  moo:
    - name: "Testing real MOO"
      command: "bash .tests/start_simple_optimization_run --max_eval=2 --num_random_steps=1 --nr_results=4 --generate_all_jobs_at_once --follow"
      wanted_exit_code: 0
    - name: "Testing real MOO with alternating results with one_param"
      command: "bash .tests/start_simple_optimization_run --max_eval=2 --num_random_steps=1 --nr_results=4 --alternate_min_max --one_param --generate_all_jobs_at_once --follow"
      wanted_exit_code: 0
    - name: "Testing continued MOO"
      command: "./omniopt --continue runs/__main__tests__BOTORCH_MODULAR__one_param_nogridsearch_nr_results_4/0 --generate_all_jobs_at_once --mem_gb=4 --follow"
      wanted_exit_code: 0
    - name: "Testing continued continued MOO"
      command: "./omniopt --continue runs/__main__tests__BOTORCH_MODULAR__one_param_nogridsearch_nr_results_4/1 --generate_all_jobs_at_once --mem_gb=4 --follow"
      wanted_exit_code: 0
    - name: "Testing continued continued continued MOO"
      command: "./omniopt --continue runs/__main__tests__BOTORCH_MODULAR__one_param_nogridsearch_nr_results_4/1 --mem_gb=4 --follow"
      wanted_exit_code: 0
    - name: "Testing real MOO with alternating results with two_params"
      command: "bash .tests/start_simple_optimization_run --max_eval=2 --num_random_steps=1 --nr_results=4 --alternate_min_max --two_params --generate_all_jobs_at_once --mem_gb=4 --follow"
      wanted_exit_code: 0
    - name: "Testing real MOO with alternating results with all_float"
      command: "bash .tests/start_simple_optimization_run --max_eval=2 --num_random_steps=1 --nr_results=4 --alternate_min_max --all_float --generate_all_jobs_at_once --mem_gb=4 --follow"
      wanted_exit_code: 0
    - name: "Testing real MOO with alternating results default"
      command: "bash .tests/start_simple_optimization_run --max_eval=2 --num_random_steps=1 --nr_results=4 --alternate_min_max --generate_all_jobs_at_once --mem_gb=4 --follow"
      wanted_exit_code: 0
    - name: "Testing TPE"
      command: ".tests/tpe.py"
      wanted_exit_code: 0

  result_handling:
    - name: "Wrong Result-Name"
      command: "{OMNIOPT_CALL} --send_anonymized_usage_stats --partition alpha --experiment_name=__main__tests__BOTORCH_MODULAR___nogridsearch_nr_results_4 --mem_gb=4 --time=60 --worker_timeout=5 --max_eval 2 --num_parallel_jobs 20 --gpus={NUM_GPUS} --run_program Li4udGVzdHMvb3B0aW1pemF0aW9uX2V4YW1wbGUgLS1pbnRfcGFyYW09JyUoaW50X3BhcmFtKScgLS1mbG9hdF9wYXJhbT0nJShmbG9hdF9wYXJhbSknIC0tY2hvaWNlX3BhcmFtPSclKGNob2ljZV9wYXJhbSknICAtLWludF9wYXJhbV90d289JyUoaW50X3BhcmFtX3R3byknIC0tbnJfcmVzdWx0cz00 --parameter int_param range -100 10 int --parameter float_param range -100 10 float --parameter choice_param choice 1,2,4,8,16,hallo --parameter int_param_two range -100 10 int --follow --num_random_steps 1 --model BOTORCH_MODULAR --auto_exclude_defective_hosts --result_names RESULT1=min RESULT2=min RESULT3=min RESULT4äää=min"
      wanted_exit_code: 50
    - name: "Multiple result names have the same value"
      command: "{OMNIOPT_CALL} --send_anonymized_usage_stats --partition alpha --experiment_name=__main__tests__BOTORCH_MODULAR___nogridsearch_nr_results_4 --mem_gb=4 --time=60 --worker_timeout=5 --max_eval 2 --num_parallel_jobs 20 --gpus={NUM_GPUS} --run_program Li4udGVzdHMvb3B0aW1pemF0aW9uX2V4YW1wbGUgLS1pbnRfcGFyYW09JyUoaW50X3BhcmFtKScgLS1mbG9hdF9wYXJhbT0nJShmbG9hdF9wYXJhbSknIC0tY2hvaWNlX3BhcmFtPSclKGNob2ljZV9wYXJhbSknICAtLWludF9wYXJhbV90d289JyUoaW50X3BhcmFtX3R3byknIC0tbnJfcmVzdWx0cz00 --parameter int_param range -100 10 int --parameter float_param range -100 10 float --parameter choice_param choice 1,2,4,8,16,hallo --parameter int_param_two range -100 10 int --follow --num_random_steps 1 --model BOTORCH_MODULAR --auto_exclude_defective_hosts --result_names RESULT1=min RESULT1=min"
      wanted_exit_code: 50
    - name: "Different name single output"
      command: "{OMNIOPT_CALL} --partition=alpha --experiment_name=result_name_different_but_only_one --mem_gb=1 --time=60 --worker_timeout=60 --max_eval=2 --num_parallel_jobs=1 --gpus={NUM_GPUS} --num_random_steps=1 --follow --send_anonymized_usage_stats --result_names xresultx=min --run_program='ZWNobyAieHJlc3VsdHg6ICVpaXV1Ig==' --cpus_per_task=1 --nodes_per_job=1 --model=BOTORCH_MODULAR --occ_type=euclid --run_mode=local --parameter iiuu range -1000 1000 float false"
      wanted_exit_code: 0

  generation_strategy:
    - name: "Generation strategy"
      command: "{OMNIOPT_CALL} --partition=alpha --experiment_name=generation_strategy --mem_gb=1 --time=60 --worker_timeout=5 --max_eval=2 --num_parallel_jobs=1 --gpus={NUM_GPUS} --num_random_steps=1 --follow --result_names RESULT=min --run_program='ZWNobyAiUkVTVUxUOiAlKGVwb2NocyklKGxyKSI=' --cpus_per_task=1 --nodes_per_job=1 --model=BOTORCH_MODULAR --occ_type=euclid --run_mode=local --parameter epochs range 1 10 float false --parameter lr range 0 10 float false --experiment_constraints 'MSpsciArIDIqZXBvY2hzIDw9IDEw' --generation_strategy 'sobol=2,BOTOrCH_MODULAR=1,UNIFORM=1'"
      wanted_exit_code: 0
    - name: "Generation strategy (continue)"
      command: "{OMNIOPT_CALL} --continue runs/generation_strategy/0"
      wanted_exit_code: 247
    - name: "Test if progressbar log has sobol and botorch"
      command: ".tests/check_if_progressbar_logs_has_sobol_and_botorch.py"
      wanted_exit_code: 0

  post_run:
    - name: "Test if results.csv has the right headers"
      command: ".tests/check_if_results_csv_has_the_right_headers.py"
      wanted_exit_code: 0
    - name: "Test debug.py"
      command: ".tests/test_debug_py.py"
      wanted_exit_code: 0
    - name: "post_job_pareto_front_calculation"
      command: ".tests/post_job_pareto_front_calculation.py"
      wanted_exit_code: 0
    - name: "post_job_pareto_front_calculation: not existing"
      command: "./omniopt --calculate_pareto_front_of_job ASDASDASDASDASD"
      wanted_exit_code: 24

  pareto:
    - name: "Multiplication constraint"
      command: ".tests/multiplication_constraint.py"
      wanted_exit_code: 0
    - name: "Defective constraint"
      command: "./omniopt --send_anonymized_usage_stats --partition alpha --experiment_name=__main__tests__BOTORCH_MODULAR___nogridsearch --mem_gb=4 --time=60 --worker_timeout=5 --max_eval 2 --num_parallel_jobs 1 --run_program Li4udGVzdHMvb3B0aW1pemF0aW9uX2V4YW1wbGUgIC0taW50X3BhcmFtPSclKGludF9wYXJhbSknIC0tZmxvYXRfcGFyYW09JyUoZmxvYXRfcGFyYW0pJyAtLWNob2ljZV9wYXJhbT0nJShjaG9pY2VfcGFyYW0pJyAtLWludF9wYXJhbV90d289JyUoaW50X3BhcmFtX3R3byknIC0tbnJfcmVzdWx0cz0x --parameter int_param range -100 10 int --parameter float_param range -100 10 float --parameter choice_param choice 1,2,4,8,16,hallo --parameter int_param_two range -100 10 int --follow --num_random_steps 1 --model BOTORCH_MODULAR --auto_exclude_defective_hosts --experiment_constraints $(echo 'float_param * 2*int_param_two <= 50' | base64 -w0) --gpus={NUM_GPUS} --max_abandoned_retrial 2"
      wanted_exit_code: 49
      alternative_exit_code: 87
    - name: "Defective constraint 2"
      command: "./omniopt --send_anonymized_usage_stats --partition alpha --experiment_name=__main__tests__BOTORCH_MODULAR___nogridsearch --mem_gb=4 --time=60 --worker_timeout=5 --max_eval 2 --num_parallel_jobs 1 --run_program Li4udGVzdHMvb3B0aW1pemF0aW9uX2V4YW1wbGUgIC0taW50X3BhcmFtPSclKGludF9wYXJhbSknIC0tZmxvYXRfcGFyYW09JyUoZmxvYXRfcGFyYW0pJyAtLWNob2ljZV9wYXJhbT0nJShjaG9pY2VfcGFyYW0pJyAtLWludF9wYXJhbV90d289JyUoaW50X3BhcmFtX3R3byknIC0tbnJfcmVzdWx0cz0x --parameter int_param range -100 10 int --parameter float_param range -100 10 float --parameter choice_param choice 1,2,4,8,16,hallo --parameter int_param_two range -100 10 int --follow --num_random_steps 1 --model BOTORCH_MODULAR --auto_exclude_defective_hosts --experiment_constraints $(echo 'float_param * 2*int_param_two = 50' | base64 -w0) --gpus={NUM_GPUS}"
      wanted_exit_code: 19

  wronggoing:
    - name: "Test stuff that goes wrong"
      command: "bash .tests/wronggoing_stuff --num_random_steps={num_random_steps} --gpus={NUM_GPUS}"
      wanted_exit_code: 0
      alternative_exit_code: 87
    - name: "Test stuff that goes wrong without successes"
      command: "bash .tests/wronggoing_stuff --nosuccess --num_random_steps={num_random_steps} --gpus={NUM_GPUS}"
      wanted_exit_code: 87
      alternative_exit_code: 89

  dryrun:
    - name: "Testing dryrun"
      command: ".tests/start_simple_optimization_run.py --max_eval=1 --num_parallel_jobs=2 --num_random_steps=1 --mem_gb=4 --generate_all_jobs_at_once --follow --testname=xyz --nr_results=1 --additional_parameter='--dryrun --just_return_defaults'"
      wanted_exit_code: 0

  transforms:
    - name: "Continued constraint"
      command: ".tests/continued_constraint.py"
      wanted_exit_code: 0
    - name: "Transforms-Test"
      command: ".tests/transforms.py"
      wanted_exit_code: 0

  gui:
    - name: "OO-setup from GUI"
      command: "{OMNIOPT_CALL} --partition=alpha --experiment_name=small_test_experiment --mem_gb=10 --time=60 --worker_timeout=60 --max_eval=2 --num_parallel_jobs=1 --gpus={NUM_GPUS} --num_random_steps=1 --follow --send_anonymized_usage_stats --run_program='ZWNobyAiUkVTVUxUOiAlKHgpJSh5KSI=' --result_names RESULT --cpus_per_task=1 --nodes_per_job=1 --model=BOTORCH_MODULAR --occ_type=euclid --run_mode=local --parameter x range 123 1000 int false --parameter y range 5431 1234 float false --ui_url "
      wanted_exit_code: 0
    - name: "OO-Setup-2 from GUI"
      command: "{OMNIOPT_CALL} --partition=alpha --experiment_name=oo_setup_from_gui --mem_gb=1 --time=60 --worker_timeout=5 --max_eval=2 --num_parallel_jobs=1 --gpus={NUM_GPUS} --num_random_steps=1 --follow --result_names RESULT=min --run_program='ZWNobyAiUkVTVUxUOiAlKGVwb2NocyklKGxyKSI=' --cpus_per_task=1 --nodes_per_job=1 --model=BOTORCH_MODULAR --occ_type=euclid --run_mode=local --parameter epochs range 1 10 float false --parameter lr range 0 10 float false --experiment_constraints 'MSpsciArIDIqZXBvY2hzIDw9IDEw' --ui_url "
      wanted_exit_code: 0

  continue_run:
    - name: "Continue non-existing job"
      command: "./omniopt --continue runs/__main__I_DO_NOT_EXIST_tests__/0 --num_parallel_jobs {num_parallel_jobs} --worker_timeout 10 --mem_gb {mem_gb} --time 30 --follow --gpus {NUM_GPUS} --num_random_steps={num_random_steps} --max_eval={max_eval} --send_anonymized_usage_stats --verbose"
      wanted_exit_code: 44
    - name: "Trying to run 0 random steps (should fail)"
      command: "./omniopt --partition=alpha --experiment_name={TESTNAME} --mem_gb={mem_gb} --time=60 --worker_timeout=1 --max_eval=2 --num_parallel_jobs=20 --gpus {NUM_GPUS} --run_program=Li4udGVzdHMvb3B0aW1pemF0aW9uX2V4YW1wbGUgLS1pbnRfcGFyYW09JyUoaW50X3BhcmFtKScgLS1mbG9hdF9wYXJhbT0nJShmbG9hdF9wYXJhbSknIC0tY2hvaWNlX3BhcmFtPSclKGNob2ljZV9wYXJhbSknICAtLWludF9wYXJhbV90d289JyUoaW50X3BhcmFtX3R3bykn --parameter int_param range -5 5 int --parameter float_param range -5 5 float --parameter choice_param choice 1,2,4,8,16,hallo --parameter int_param_two range -6 6 int --num_random_steps=0 --follow --send_anonymized_usage_stats --debug"
      wanted_exit_code: 233

  docker:
    - name: "Docker"
      command: "bash omniopt_docker ./.tests/main --quick --num_random_steps=1 --max_eval=2 --superquick --exit_on_first_error"
      wanted_exit_code: 0
      skip_if: is_ci_or_docker_or_no_docker

  slurm_docker:
    - name: "Running Slurm-Docker-Test"
      command: ".tests/slurm_docker/run_docker.py --run_tests"
      wanted_exit_code: 0
      skip_if: is_ci_or_docker_or_no_docker

  multi_results:
    - name: "Testing multiple results with different models"
      command: "bash .tests/multi_results_different_models"
      wanted_exit_code: 0

  all_float:
    - name: "Simple all float run"
      command: "bash .tests/start_simple_optimization_run --all_float --max_eval={max_eval} --num_parallel_jobs={num_parallel_jobs} --num_random_steps={num_random_steps} --model={model_name} --mem_gb={mem_gb} --generate_all_jobs_at_once --follow"
      wanted_exit_code: 0

  variants:
    - name: "Simple optimization run (with allowed failures)"
      command: ".tests/start_simple_optimization_run.py --max_eval={max_eval} --num_parallel_jobs={num_parallel_jobs} --allow_failure --num_random_steps={num_random_steps} --mem_gb={mem_gb} --generate_all_jobs_at_once --follow"
      wanted_exit_code: 0
    - name: "Simple optimization run (grid search)"
      command: ".tests/start_simple_optimization_run.py --max_eval={max_eval} --num_parallel_jobs={num_parallel_jobs} --num_random_steps={num_random_steps} --gridsearch --mem_gb={mem_gb} --generate_all_jobs_at_once --follow"
      wanted_exit_code: 0
    - name: "Simple optimization run with 1 param"
      command: ".tests/start_simple_optimization_run.py --one_param --max_eval={max_eval} --num_parallel_jobs={num_parallel_jobs} --num_random_steps={num_random_steps} --mem_gb={mem_gb} --generate_all_jobs_at_once --follow"
      wanted_exit_code: 0
    - name: "Simple optimization run with 2 params"
      command: ".tests/start_simple_optimization_run.py --two_params --max_eval={max_eval} --num_parallel_jobs={num_parallel_jobs} --num_random_steps={num_random_steps} --mem_gb={mem_gb} --generate_all_jobs_at_once --follow"
      wanted_exit_code: 0

  log_scale:
    - name: "log scale test"
      command: "{OMNIOPT_CALL} --partition=alpha --experiment_name=log_scale_test --mem_gb=1 --time=60 --worker_timeout=60 --max_eval=2 --num_parallel_jobs=1 --gpus={NUM_GPUS} --num_random_steps=1 --run_program=ZWNobyAiUkVTVUxUOiAlKHgpJSh5KSI= --cpus_per_task=1 --nodes_per_job=1 --model=BOTORCH_MODULAR --run_mode=local --parameter x range 123 1000 int false --parameter y range 5431 1234 float true"
      wanted_exit_code: 0

  plots:
    - name: "Plot-Tests"
      command: "python3 .tests/plots.py"
      wanted_exit_code: 0
      only_if: not_quick

  share:
    - name: "share"
      command: "python3 .tests/share.py"
      wanted_exit_code: 0
      only_if: is_ci

  linkchecker:
    - name: "Linkchecker"
      command: ".tests/linkchecker.py"
      wanted_exit_code: 0
      skip_if: is_ci_or_docker

# Individual scripts that smoke_tests runs.
