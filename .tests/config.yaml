# =============================================================================
# OmniOpt test configuration
# =============================================================================
# This is the single source of truth for every test that gets executed.
# A test is identified by `id` (unique) and has a `name`, a `cmd` (shell string
# or python function reference), and one or more `tags`. Selectors filter by
# tag at runtime.
#
# Placeholders in `cmd` are filled from the `parameters` section (or from
# command-line flags like --max_eval=42). Everything that was available as a
# bash variable in the old scripts is exposed here.
# =============================================================================

parameters:
  NUM_GPUS:           {default: 0,    cli: --gpus,                type: int, description: "GPUs per worker"}
  max_eval:           {default: 30,   cli: --max_eval,            type: int, description: "Max evaluations"}
  num_parallel_jobs:  {default: 20,   cli: --num_parallel_jobs,   type: int, description: "Number of parallel workers"}
  num_random_steps:   {default: 20,   cli: --num_random_steps,    type: int, description: "Number of random steps"}
  mem_gb:             {default: 4,    cli: --mem_gb,              type: int, description: "Memory in GB"}
  TESTNAME:           {default: "__main__tests__BOTORCH_MODULAR___nogridsearch", cli: --testname, type: str}
  OMNIOPT_CALL:       {default: "./omniopt",  cli: --omniopt_call,    type: str}
  CONFIG_VARIANT:     {default: "cpu",         cli: --config_variant,  type: str, description: "cpu or gpu"}

# -----------------------------------------------------------------------------
# Tag categories:
#   suite:meta      - runs before any real tests (smoke / pyright / linter)
#   suite:basic     - the cheap omniopt self-test
#   suite:full      - the heavier integration suite
#   suite:plot      - plot generation
#   suite:share     - PHP share pages
#   suite:linter    - linter / static checks
#   suite:link      - linkchecker
#   suite:docker    - docker/slurm docker
#   quick:false     - skipped under --quick
#   quick:no        - skipped under --quick and --reallyquick
#   quick:never     - skipped under --quick, --reallyquick, --superquick
#   env:ci          - only run under CI
#   env:local       - only run outside CI/containers
#   env:gpu         - only run when NUM_GPUS > 0
#   env:slurm       - only run when sbatch is available
#   env:docker      - only run when docker is available (and not in container)
# -----------------------------------------------------------------------------

tests:

  # ---- meta: smoke / pyright -------------------------------------------------
  - id: smoke_tests
    name: "Smoke tests"
    cmd: "python3 {REPO_ROOT}/.tests/smoke_tests.py"
    wanted_exit_code: 0
    tags: [suite:meta, quick:false, env:local]

  - id: pyright
    name: "pyright"
    cmd: "pyright ."
    wanted_exit_code: 0
    tags: [suite:meta, env:local]

  - id: share_ci
    name: "share"
    cmd: "python3 {REPO_ROOT}/.tests/share.py"
    wanted_exit_code: 0
    tags: [suite:share, env:ci]

  # ---- basic omniopt self-test ---------------------------------------------
  - id: basic_tests
    name: "Basic tests"
    cmd: "{OMNIOPT_CALL} --tests --mem_gb 1 --time 10 --experiment_name test_name --gpus {NUM_GPUS}"
    wanted_exit_code: 0
    tags: [suite:basic]

  # ---- simple optimization run ---------------------------------------------
  - id: simple_optimization_run
    name: "Simple optimization run"
    cmd: "{REPO_ROOT}/.tests/start_simple_optimization_run.py --num_parallel_jobs={num_parallel_jobs} --gpus={NUM_GPUS} --num_random_steps={num_random_steps} --max_eval={max_eval} --mem_gb={mem_gb} --generate_all_jobs_at_once --follow"
    wanted_exit_code: 0
    tags: [suite:full, quick:no]

  - id: continued_test_run
    name: "Continued test run"
    cmd: "./omniopt --continue runs/{TESTNAME}/0 --num_parallel_jobs {num_parallel_jobs} --worker_timeout 10 --follow --gpus {NUM_GPUS} --mem_gb {mem_gb} --num_random_steps={num_random_steps} --max_eval={max_eval} --send_anonymized_usage_stats --generate_all_jobs_at_once"
    wanted_exit_code: 0
    tags: [suite:full, quick:no]

  - id: continuing_already_continued_job
    name: "Continuing already continued job"
    cmd: "./omniopt --continue runs/{TESTNAME}/1 --num_parallel_jobs {num_parallel_jobs} --worker_timeout 10 --follow --gpus {NUM_GPUS} --mem_gb {mem_gb} --num_random_steps={num_random_steps} --max_eval={max_eval} --parameter float_param range -1000 1000 float --send_anonymized_usage_stats --generate_all_jobs_at_once"
    wanted_exit_code: 0
    tags: [suite:full, quick:no]

  # ---- defective configs ----------------------------------------------------
  - id: defective_toml
    name: "Testing defective toml file"
    cmd: "{OMNIOPT_CALL} --config_toml {REPO_ROOT}/.tests/defective_example_config.toml --follow"
    wanted_exit_code: 5
    alternative_exit_code: 1
